name: CI

# Runs on every push and pull request. Both jobs are offline-safe: the web unit tests use
# node:test with no network, and the API tests skip themselves when cached data or IRSA is
# unavailable (api/tests/test_api.py). The browser tests (Playwright) need a running API and
# a warmed cache, so they stay a local command (`cd web && npm run test:e2e`).

on:
  push:
    branches: [main, ui-guide]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: api
      - run: python -m pytest -q
        working-directory: api

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deploy image
        run: docker build -t meridian .

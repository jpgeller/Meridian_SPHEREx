# Prompts for the deep-zoom artist's impressions (docs/AI_IMAGES_PLAN.md, A1/A2).
# Facts come from impressions/facts/<target>.md. Rules: original pictures only (no artist or agency named, no reference
# images), no text painted in, physics from the facts sheet.

style: >-
  An original, photorealistic space-art illustration in the style of a modern astronomy artist's impression.
  Deep black space, a few sharp faint background stars, physically plausible lighting from the stated light sources only.
  No text, no labels, no captions, no logos, no watermark, no frame or border, no spacecraft, no people,
  no lens-flare streaks across the frame.

# Outpainting: the centre quarter of the canvas already holds the closer picture. It must stay exactly as it is.
outpaint_rule: >-
  This picture is the centre of a wider view. Keep the central square exactly as it is: same subject, size, colours and
  position. Paint only the empty surroundings so that the whole canvas reads as one seamless picture, with no visible
  border, frame or change of style around the centre.

targets:
  eps_ind_b:
    facts: facts/eps_ind_b.md
    levels:
      L3: >-
        Close-up of a single brown dwarf, a ball of gas about the size of Jupiter, filling about 70% of the square frame,
        seen slightly from the side. It is too cold to shine like a star: it glows dimly, deep red to dark magenta, because
        methane absorbs most of its visible light. Soft horizontal cloud bands and darker patchy gaps where warmer layers
        below glow a little brighter orange-red. Its night side fades into black. Lit faintly from one side by a distant
        orange star that is out of frame.
      L2: >-
        Two brown dwarfs orbiting each other. The one in the centre is already painted. Its companion is about the same
        size but colder, so darker and a deeper magenta with fainter bands, placed off to one side at a distance of several
        times their size, partly lit on the side facing its partner. Black space with sparse faint stars. Far in the
        background a single bright orange point of light: their distant star.
